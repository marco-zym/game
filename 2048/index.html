<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2048</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0b0c1e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      touch-action: pan-y;  
    }
    .game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 8px;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 800px;
      max-height: 800px;
      border-radius: 24px;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.6), 0 0 0 2px #2f2e5a inset;
      background: #191b2e;
      touch-action: none;
      cursor: pointer;
    }
    .info-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 800px;
      margin-top: 12px;
      padding: 0 8px;
      color: #b9c6ff;
      font-weight: 600;
      letter-spacing: 1px;
      text-shadow: 0 2px 5px #00000080;
      font-size: clamp(14px, 4vw, 20px);
    }
    .left-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .score-board, .best-board, .target-board {
      background: #20223b;
      padding: 6px 18px;
      border-radius: 40px;
      border: 1px solid #4c4e8b;
      box-shadow: 0 5px 0 #0e0f1d;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .score-board span, .best-board span, .target-board span {
      color: #f5e56b;
      font-size: 1.4em;
      min-width: 2.5em;
      text-align: center;
    }
    .best-board span {
      color: #7df9ff;
    }
    .target-board span {
      color: #ff9f6b;
    }
    .target-board.highlight {
      border-color: #ff9f6b;
      box-shadow: 0 0 12px #ff9f6b80;
    }
    .hint {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #20223b;
      padding: 6px 16px;
      border-radius: 40px;
      border: 1px solid #4c4e8b;
      box-shadow: 0 5px 0 #0e0f1d;
    }
    .hint i {
      font-style: normal;
      font-size: 1.2em;
    }
    @media (max-width: 700px) {
      .info-bar {
        margin-top: 8px;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .left-group {
        justify-content: space-between;
        width: 100%;
        flex-wrap: wrap;
        gap: 6px;
      }
      .hint {
        justify-content: center;
      }
      .score-board, .best-board, .target-board {
        padding: 4px 10px;
        font-size: 0.9em;
      }
      .score-board span, .best-board span, .target-board span {
        font-size: 1.2em;
        min-width: 2em;
      }
    }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #2f2e5a;
      color: #f0e68c;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      border: 1px solid #6d8cff;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
    }
    .copy-btn-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 40px;
      pointer-events: none;
      z-index: 10;
    }
    .copy-btn {
      pointer-events: auto;
      background: linear-gradient(145deg, #3f5efb, #5f7dff);
      color: white;
      border: none;
      padding: 14px 36px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 8px 0 #1a2a6c, 0 12px 25px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      letter-spacing: 1px;
      border: 1px solid #9bb0ff;
      display: none;
    }
    .copy-btn:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #1a2a6c, 0 8px 20px rgba(0,0,0,0.5);
    }
    .copy-btn.show {
      display: block;
    }
  </style>
</head>
<body>
<div class="game-wrapper">
  <div style="position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
    <canvas id="gameCanvas"></canvas>
    <div class="copy-btn-overlay" id="copyOverlay">
      <button class="copy-btn" id="copyBtn">📋 复制战绩</button>
    </div>
  </div>
  <div class="info-bar">
    <div class="left-group">
      <div class="score-board">⚡ <span id="scoreDisplay">0</span></div>
      <div class="best-board">🏆 <span id="bestDisplay">0</span></div>
      <div class="target-board" id="targetBoard">🎯 <span id="targetDisplay">0</span></div>
    </div>
    <div class="hint"><i>👆</i> 滑动/方向键 移动方块</div>
  </div>
</div>
<div id="toast" class="toast">战绩已复制！</div>
<script>
  (function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreSpan = document.getElementById('scoreDisplay');
    const bestSpan = document.getElementById('bestDisplay');
    const targetSpan = document.getElementById('targetDisplay');
    const targetBoard = document.getElementById('targetBoard');
    const toastEl = document.getElementById('toast');
    const copyBtn = document.getElementById('copyBtn');

    const LOGIC_SIZE = 600;
    const GRID_SIZE = 4;
    const CELL_SIZE = LOGIC_SIZE / GRID_SIZE;
    const CELL_PADDING = 10;
    const TILE_RADIUS = 12;
    const MOVE_ANIM_DURATION = 120;
    const MERGE_ANIM_DURATION = 200;

    const STORAGE_KEY = 'highScore';

    const COLORS = {
      bg: '#191b2e',
      gridLine: '#2a2d4a',
      emptyCell: '#20223b',
      emptyCellBorder: '#2f2e5a',
      2:    { bg: '#2e2f5e', text: '#d0d8ff' },
      4:    { bg: '#3d3f7a', text: '#e0e6ff' },
      8:    { bg: '#4f52a0', text: '#ffffff' },
      16:   { bg: '#6b4faf', text: '#ffffff' },
      32:   { bg: '#8a4fbf', text: '#ffffff' },
      64:   { bg: '#b34fcf', text: '#ffffff' },
      128:  { bg: '#d44fa0', text: '#ffffff' },
      256:  { bg: '#f05a7a', text: '#ffffff' },
      512:  { bg: '#ff7a5a', text: '#ffffff' },
      1024: { bg: '#ffaa4a', text: '#1a1a2e' },
      2048: { bg: '#f5e56b', text: '#1a1a2e' },
      fallback: { bg: '#ffcc33', text: '#1a1a2e' }
    };

    let board = [];
    let score = 0;
    let bestScore = 0;
    let gameOver = false;
    let won = false;
    let targetScore = 0;
    let highScore = 0;

    let tiles = [];
    let animating = false;
    let animationStartTime = 0;
    let animationDuration = 0;
    let mergePositions = [];

    function loadBestScore() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        bestScore = saved !== null ? (parseInt(saved) || 0) : 0;
      } catch (e) {
        bestScore = 0;
      }
      bestSpan.textContent = bestScore;
    }

    function saveBestScore(value) {
      if (value > bestScore) {
        bestScore = value;
        try { localStorage.setItem(STORAGE_KEY, bestScore); } catch (e) {}
        bestSpan.textContent = bestScore;
      }
    }

    function getTargetFromURL() {
      const params = new URLSearchParams(window.location.search);
      const target = params.get('target');
      if (target !== null && !isNaN(parseInt(target))) {
        return Math.max(0, parseInt(target));
      }
      return null;
    }

    function initTargetScore() {
      const urlTarget = getTargetFromURL();
      targetScore = urlTarget !== null ? urlTarget : bestScore;
      targetSpan.textContent = targetScore;
      updateTargetDisplay();
    }

    function updateTargetDisplay() {
      targetSpan.textContent = targetScore;
      if (targetScore > 0 && score >= targetScore) {
        targetBoard.classList.add('highlight');
      } else {
        targetBoard.classList.remove('highlight');
      }
    }

    function updateScoreUI() {
      scoreSpan.textContent = score;
      if (score > bestScore) saveBestScore(score);
      if (score > highScore) highScore = score;
      const urlTarget = getTargetFromURL();
      targetScore = urlTarget !== null
        ? Math.max(highScore, urlTarget, bestScore)
        : Math.max(highScore, bestScore);
      updateTargetDisplay();
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 2000);
    }

    function initBoard() {
      board = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(0));
    }

    function addRandomTile() {
      const empty = [];
      for (let r = 0; r < GRID_SIZE; r++)
        for (let c = 0; c < GRID_SIZE; c++)
          if (board[r][c] === 0) empty.push({ r, c });
      if (empty.length === 0) return false;
      const { r, c } = empty[Math.floor(Math.random() * empty.length)];
      board[r][c] = Math.random() < 0.9 ? 2 : 4;
      return true;
    }

    function checkGameOver() {
      for (let r = 0; r < GRID_SIZE; r++)
        for (let c = 0; c < GRID_SIZE; c++)
          if (board[r][c] === 0) return false;
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const val = board[r][c];
          if (c + 1 < GRID_SIZE && board[r][c + 1] === val) return false;
          if (r + 1 < GRID_SIZE && board[r + 1][c] === val) return false;
        }
      }
      return true;
    }

    function move(direction) {
      if (gameOver || animating) return false;

      const oldBoard = board.map(row => [...row]);
      let moved = false;
      let totalScoreGain = 0;
      mergePositions = [];

      function processLine(line) {
        let nonZero = line.filter(v => v !== 0);
        let newLine = [];
        let scoreGain = 0;
        let merges = [];
        let i = 0;
        while (i < nonZero.length) {
          if (i + 1 < nonZero.length && nonZero[i] === nonZero[i + 1]) {
            const merged = nonZero[i] * 2;
            newLine.push(merged);
            scoreGain += merged;
            merges.push({ index: newLine.length - 1, value: merged });
            i += 2;
          } else {
            newLine.push(nonZero[i]);
            i++;
          }
        }
        while (newLine.length < GRID_SIZE) newLine.push(0);
        return { newLine, scoreGain, merges };
      }

      if (direction === 0) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const line = [];
          for (let r = 0; r < GRID_SIZE; r++) line.push(board[r][c]);
          const { newLine, scoreGain, merges } = processLine(line);
          totalScoreGain += scoreGain;
          for (let r = 0; r < GRID_SIZE; r++) {
            if (board[r][c] !== newLine[r]) moved = true;
            board[r][c] = newLine[r];
          }
          merges.forEach(m => { if (newLine[m.index] !== 0) mergePositions.push({ row: m.index, col: c, value: newLine[m.index] }); });
        }
      } else if (direction === 1) {
        for (let r = 0; r < GRID_SIZE; r++) {
          const line = board[r].slice().reverse();
          const { newLine, scoreGain, merges } = processLine(line);
          totalScoreGain += scoreGain;
          const reversedBack = newLine.slice().reverse();
          for (let c = 0; c < GRID_SIZE; c++) {
            if (board[r][c] !== reversedBack[c]) moved = true;
            board[r][c] = reversedBack[c];
          }
          merges.forEach(m => {
            const col = GRID_SIZE - 1 - m.index;
            if (reversedBack[col] !== 0) mergePositions.push({ row: r, col, value: reversedBack[col] });
          });
        }
      } else if (direction === 2) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const line = [];
          for (let r = GRID_SIZE - 1; r >= 0; r--) line.push(board[r][c]);
          const { newLine, scoreGain, merges } = processLine(line);
          totalScoreGain += scoreGain;
          const reversedBack = newLine.slice().reverse();
          for (let r = 0; r < GRID_SIZE; r++) {
            if (board[r][c] !== reversedBack[r]) moved = true;
            board[r][c] = reversedBack[r];
          }
          merges.forEach(m => {
            const row = GRID_SIZE - 1 - m.index;
            if (reversedBack[row] !== 0) mergePositions.push({ row, col: c, value: reversedBack[row] });
          });
        }
      } else if (direction === 3) {
        for (let r = 0; r < GRID_SIZE; r++) {
          const line = board[r].slice();
          const { newLine, scoreGain, merges } = processLine(line);
          totalScoreGain += scoreGain;
          for (let c = 0; c < GRID_SIZE; c++) {
            if (board[r][c] !== newLine[c]) moved = true;
            board[r][c] = newLine[c];
          }
          merges.forEach(m => { if (newLine[m.index] !== 0) mergePositions.push({ row: r, col: m.index, value: newLine[m.index] }); });
        }
      }

      if (!moved) return false;

      score += totalScoreGain;
      updateScoreUI();
      addRandomTile();

      if (!won) {
        outer: for (let r = 0; r < GRID_SIZE; r++)
          for (let c = 0; c < GRID_SIZE; c++)
            if (board[r][c] === 2048) { won = true; showToast('🎉 恭喜合成 2048！继续挑战吧'); break outer; }
      }

      if (checkGameOver()) {
        gameOver = true;
        copyBtn.classList.add('show');
      }

      function findSourcePosition(fr, fc, fv, oldB, dir) {
        if (dir === 0) { for (let r = fr; r < GRID_SIZE; r++) if (oldB[r][fc] === fv) return { row: r, col: fc }; }
        else if (dir === 1) { for (let c = fc; c >= 0; c--) if (oldB[fr][c] === fv) return { row: fr, col: c }; }
        else if (dir === 2) { for (let r = fr; r >= 0; r--) if (oldB[r][fc] === fv) return { row: r, col: fc }; }
        else if (dir === 3) { for (let c = fc; c < GRID_SIZE; c++) if (oldB[fr][c] === fv) return { row: fr, col: c }; }
        return { row: fr, col: fc };
      }

      tiles = [];
      const now = performance.now();
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const value = board[r][c];
          if (value === 0) continue;
          let source = findSourcePosition(r, c, value, oldBoard, direction);
          if (oldBoard[source.row][source.col] !== value) source = { row: r, col: c };
          const isMergeResult = mergePositions.some(m => m.row === r && m.col === c && m.value === value);
          tiles.push({
            value, row: r, col: c,
            fromRow: source.row, fromCol: source.col,
            renderRow: source.row, renderCol: source.col,
            isNew: false, isMerge: isMergeResult,
            startTime: now
          });
        }
      }
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if (oldBoard[r][c] === 0 && board[r][c] !== 0) {
            const tile = tiles.find(t => t.row === r && t.col === c);
            if (tile) {
              tile.isNew = true;
              tile.startTime = now;
              tile.fromRow = r; tile.fromCol = c;
              tile.renderRow = r; tile.renderCol = c;
            }
          }
        }
      }

      animating = true;
      animationStartTime = now;
      animationDuration = Math.max(MOVE_ANIM_DURATION, MERGE_ANIM_DURATION);

      setTimeout(() => {
        animating = false;
        tiles = [];
      }, animationDuration + 10);

      return true;
    }

    function resetGame() {
      initBoard();
      addRandomTile();
      addRandomTile();
      score = 0;
      gameOver = false;
      won = false;
      animating = false;
      tiles = [];
      mergePositions = [];
      copyBtn.classList.remove('show');

      const urlTarget = getTargetFromURL();
      targetScore = urlTarget !== null ? urlTarget : bestScore;

      updateScoreUI();
      updateTargetDisplay();
      targetBoard.classList.remove('highlight');
    }

    function copyScoreToClipboard() {
      const baseUrl = window.location.href.split('?')[0];
      const newUrl = `${baseUrl}?target=${targetScore}`;
      const message = `我在「2048」中获得了 ${score} 分！最高目标 ${targetScore} 分，来挑战我吧 → ${newUrl}`;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(message).then(() => showToast('战绩已复制！快去分享吧')).catch(() => fallbackCopy(message));
      } else {
        fallbackCopy(message);
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      try {
        if (document.execCommand('copy')) showToast('战绩已复制！快去分享吧');
        else showToast('复制失败，请手动截图分享');
      } catch (err) {
        showToast('复制失败，请手动截图分享');
      }
      document.body.removeChild(textarea);
    }

    copyBtn.addEventListener('click', (e) => { e.stopPropagation(); copyScoreToClipboard(); });

    function drawTile(x, y, w, h, value, scale) {
      const colorSet = getTileColor(value);
      const centerX = x + w / 2;
      const centerY = y + h / 2;

      ctx.save();
      if (scale !== 1.0) {
        ctx.translate(centerX, centerY);
        ctx.scale(scale, scale);
        ctx.translate(-centerX, -centerY);
      }

      ctx.shadowColor = '#6d8cff';
      ctx.shadowBlur = 12;
      ctx.fillStyle = colorSet.bg;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, TILE_RADIUS);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#ffffff30';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x + 2, y + 2, w - 4, h - 4, TILE_RADIUS - 2);
      ctx.stroke();

      ctx.shadowColor = '#00000080';
      ctx.shadowBlur = 8;
      ctx.fillStyle = colorSet.text;
      ctx.font = `bold ${value >= 1000 ? 36 : value >= 100 ? 44 : 52}px system-ui, 'Segoe UI', Roboto, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(value, centerX, centerY);

      ctx.restore();
      ctx.shadowBlur = 0;
      ctx.shadowColor = 'transparent';
    }

    function getTileColor(value) {
      return COLORS[value] || COLORS.fallback;
    }

    function draw() {
      ctx.clearRect(0, 0, LOGIC_SIZE, LOGIC_SIZE);
      ctx.fillStyle = COLORS.bg;
      ctx.fillRect(0, 0, LOGIC_SIZE, LOGIC_SIZE);

      ctx.strokeStyle = COLORS.gridLine;
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID_SIZE; i++) {
        const pos = i * CELL_SIZE;
        ctx.beginPath(); ctx.moveTo(pos, 0); ctx.lineTo(pos, LOGIC_SIZE); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, pos); ctx.lineTo(LOGIC_SIZE, pos); ctx.stroke();
      }

      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if (board[r][c] !== 0) continue;
          const x = c * CELL_SIZE + CELL_PADDING / 2;
          const y = r * CELL_SIZE + CELL_PADDING / 2;
          const w = CELL_SIZE - CELL_PADDING;
          const h = CELL_SIZE - CELL_PADDING;
          ctx.fillStyle = COLORS.emptyCell;
          ctx.beginPath();
          ctx.roundRect(x, y, w, h, TILE_RADIUS);
          ctx.fill();
          ctx.strokeStyle = COLORS.emptyCellBorder;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      if (!animating) {
        for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
            const value = board[r][c];
            if (value === 0) continue;
            const x = c * CELL_SIZE + CELL_PADDING / 2;
            const y = r * CELL_SIZE + CELL_PADDING / 2;
            const w = CELL_SIZE - CELL_PADDING;
            const h = CELL_SIZE - CELL_PADDING;
            drawTile(x, y, w, h, value, 1.0);
          }
        }
      } else {
        const now = performance.now();
        for (const tile of tiles) {
          if (tile.value === 0) continue;

          let renderRow, renderCol, scale = 1.0;

          if (tile.isNew) {
            const t = Math.min(1, (now - tile.startTime) / 250);
            scale = t < 0.5 ? t * 2 : 1;
            renderRow = tile.row;
            renderCol = tile.col;
          } else if (tile.isMerge) {
            const t = Math.min(1, (now - tile.startTime) / MERGE_ANIM_DURATION);
            scale = 1.0 + Math.sin(t * Math.PI) * 0.15;
            renderRow = tile.row;
            renderCol = tile.col;
          } else {
            const t = Math.min(1, (now - tile.startTime) / MOVE_ANIM_DURATION);
            const easeT = 1 - Math.pow(1 - t, 3);
            renderRow = tile.fromRow + (tile.row - tile.fromRow) * easeT;
            renderCol = tile.fromCol + (tile.col - tile.fromCol) * easeT;
          }

          if (isNaN(renderRow) || isNaN(renderCol)) {
            renderRow = tile.row;
            renderCol = tile.col;
          }

          const x = renderCol * CELL_SIZE + CELL_PADDING / 2;
          const y = renderRow * CELL_SIZE + CELL_PADDING / 2;
          const w = CELL_SIZE - CELL_PADDING;
          const h = CELL_SIZE - CELL_PADDING;
          drawTile(x, y, w, h, tile.value, scale);
        }
      }

      if (gameOver) {
        ctx.fillStyle = 'rgba(10, 10, 20, 0.75)';
        ctx.fillRect(0, 0, LOGIC_SIZE, LOGIC_SIZE);

        ctx.font = 'bold 52px system-ui, "Segoe UI", Roboto, sans-serif';
        ctx.fillStyle = '#ffb3b3';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = '#ff000080';
        ctx.shadowBlur = 20;
        ctx.fillText('游戏结束', LOGIC_SIZE / 2, LOGIC_SIZE / 2 - 50);

        ctx.font = 'bold 36px system-ui, sans-serif';
        ctx.fillStyle = '#f0e68c';
        ctx.shadowColor = '#ffaa00';
        ctx.fillText(`得分: ${score}`, LOGIC_SIZE / 2, LOGIC_SIZE / 2 + 30);

        if (targetScore > 0) {
          ctx.font = '24px system-ui, sans-serif';
          ctx.fillStyle = '#ffb86b';
          ctx.shadowColor = '#ff9f6b';
          ctx.fillText(`目标最高分: ${targetScore}`, LOGIC_SIZE / 2, LOGIC_SIZE / 2 + 85);
        }

        ctx.font = '28px system-ui, sans-serif';
        ctx.fillStyle = '#bbccff';
        ctx.shadowBlur = 12;
        ctx.fillText('点击屏幕重新开始', LOGIC_SIZE / 2, LOGIC_SIZE / 2 + 140);
        ctx.shadowBlur = 0;
      }

      ctx.shadowBlur = 0;
      ctx.shadowColor = 'transparent';
    }

    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r);
        this.lineTo(x + w, y + h - r);
        this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.lineTo(x + r, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r);
        this.lineTo(x, y + r);
        this.quadraticCurveTo(x, y, x + r, y);
        this.closePath();
        return this;
      };
    }

    let touchStartX = 0, touchStartY = 0, touchMoved = false;

    function handlePointerDown(e) {
      e.preventDefault();
      if (gameOver) { resetGame(); return; }
      if (e.touches) {
        if (e.touches.length > 0) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          touchMoved = false;
        }
      } else {
        touchStartX = e.clientX;
        touchStartY = e.clientY;
        touchMoved = false;
      }
    }

    function handlePointerMove(e) { e.preventDefault(); }

    function handlePointerUp(e) {
      e.preventDefault();
      if (gameOver || animating || touchMoved) return;

      let endX, endY;
      if (e.changedTouches) {
        endX = e.changedTouches[0].clientX;
        endY = e.changedTouches[0].clientY;
      } else {
        endX = e.clientX;
        endY = e.clientY;
      }

      const dx = endX - touchStartX;
      const dy = endY - touchStartY;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;

      if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : 3);
      else move(dy > 0 ? 2 : 0);
      touchMoved = true;
    }

    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    canvas.addEventListener('pointerdown', handlePointerDown);
    canvas.addEventListener('pointermove', handlePointerMove);
    canvas.addEventListener('pointerup', handlePointerUp);
    canvas.addEventListener('pointercancel', handlePointerUp);

    canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
    canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    canvas.addEventListener('touchend', (e) => e.preventDefault(), { passive: false });

    window.addEventListener('keydown', (e) => {
      if (gameOver) {
        if (e.key === 'Enter' || e.key === ' ') { resetGame(); e.preventDefault(); }
        return;
      }
      if (animating) return;
      switch (e.key) {
        case 'ArrowUp':    move(0); e.preventDefault(); break;
        case 'ArrowRight': move(1); e.preventDefault(); break;
        case 'ArrowDown':  move(2); e.preventDefault(); break;
        case 'ArrowLeft':  move(3); e.preventDefault(); break;
      }
    });

    function initCanvasSize() {
      canvas.width = LOGIC_SIZE;
      canvas.height = LOGIC_SIZE;
    }

    function gameLoop() {
      draw();
      requestAnimationFrame(gameLoop);
    }

    function initGame() {
      initCanvasSize();
      loadBestScore();
      initTargetScore();
      resetGame();
      gameLoop();
    }

    window.addEventListener('load', () => initGame());

  })();
</script>
</body>
</html>
