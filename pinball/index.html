<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>弹球游戏</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0b0c1e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      touch-action: pan-y;  
    }
    .game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 8px;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 800px;
      max-height: 800px;
      border-radius: 24px;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.6), 0 0 0 2px #2f2e5a inset;
      background: #191b2e;
      touch-action: none;
      cursor: pointer;
    }
    .info-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 800px;
      margin-top: 12px;
      padding: 0 8px;
      color: #b9c6ff;
      font-weight: 600;
      letter-spacing: 1px;
      text-shadow: 0 2px 5px #00000080;
      font-size: clamp(14px, 4vw, 20px);
    }
    .left-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .score-board, .speed-board, .target-board {
      background: #20223b;
      padding: 6px 18px;
      border-radius: 40px;
      border: 1px solid #4c4e8b;
      box-shadow: 0 5px 0 #0e0f1d;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .score-board span, .speed-board span, .target-board span {
      color: #f5e56b;
      font-size: 1.4em;
      min-width: 2.5em;
      text-align: center;
    }
    .speed-board span {
      color: #7df9ff;
      min-width: 3em;
    }
    .target-board span {
      color: #ff9f6b;
      min-width: 3em;
    }
    .target-board.highlight {
      border-color: #ff9f6b;
      box-shadow: 0 0 12px #ff9f6b80;
    }
    .hint {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #20223b;
      padding: 6px 16px;
      border-radius: 40px;
      border: 1px solid #4c4e8b;
      box-shadow: 0 5px 0 #0e0f1d;
    }
    .hint i {
      font-style: normal;
      font-size: 1.2em;
    }
    @media (max-width: 700px) {
      .info-bar {
        margin-top: 8px;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .left-group {
        justify-content: space-between;
        width: 100%;
        flex-wrap: wrap;
        gap: 6px;
      }
      .hint {
        justify-content: center;
      }
      .score-board, .speed-board, .target-board {
        padding: 4px 10px;
        font-size: 0.9em;
      }
      .score-board span, .speed-board span, .target-board span {
        font-size: 1.2em;
        min-width: 2em;
      }
    }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #2f2e5a;
      color: #f0e68c;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      border: 1px solid #6d8cff;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
    }
    .copy-btn-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 40px;
      pointer-events: none;
      z-index: 10;
    }
    .copy-btn {
      pointer-events: auto;
      background: linear-gradient(145deg, #3f5efb, #5f7dff);
      color: white;
      border: none;
      padding: 14px 36px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 8px 0 #1a2a6c, 0 12px 25px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      letter-spacing: 1px;
      border: 1px solid #9bb0ff;
      display: none;
    }
    .copy-btn:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #1a2a6c, 0 8px 20px rgba(0,0,0,0.5);
    }
    .copy-btn.show {
      display: block;
    }
  </style>
</head>
<body>
<div class="game-wrapper">
  <div style="position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
    <canvas id="gameCanvas"></canvas>
    <div class="copy-btn-overlay" id="copyOverlay">
      <button class="copy-btn" id="copyBtn">📋 复制战绩</button>
    </div>
  </div>
  <div class="info-bar">
    <div class="left-group">
      <div class="score-board">⚡ <span id="scoreDisplay">0</span></div>
      <div class="speed-board">💨 <span id="speedDisplay">4.8</span></div>
      <div class="target-board" id="targetBoard">🎯 <span id="targetDisplay">0</span></div>
    </div>
    <div class="hint"><i>👆</i> 点击/触摸 弹射</div>
  </div>
</div>
<div id="toast" class="toast">战绩已复制！</div>
<script>
  (function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreSpan = document.getElementById('scoreDisplay');
    const speedSpan = document.getElementById('speedDisplay');
    const targetSpan = document.getElementById('targetDisplay');
    const targetBoard = document.getElementById('targetBoard');
    const toastEl = document.getElementById('toast');
    const copyBtn = document.getElementById('copyBtn');

    const LOGIC_SIZE = 600;

    function getTargetFromURL() {
      const params = new URLSearchParams(window.location.search);
      const target = params.get('target');
      if (target !== null && !isNaN(parseInt(target))) {
        return Math.max(0, parseInt(target));
      }
      return 0;
    }

    let targetScore = getTargetFromURL();
    let highScore = targetScore;

    let score = 0;
    let gameOver = false;

    const BALL_RADIUS = 14;
    const PADDLE_WIDTH = 100;
    const PADDLE_HEIGHT = 16;
    const PADDLE_Y = LOGIC_SIZE - 60;
    const BASE_BALL_SPEED = 4.8;

    let ball = {
      x: LOGIC_SIZE / 2,
      y: LOGIC_SIZE / 2,
      vx: 0,
      vy: 0,
      speed: BASE_BALL_SPEED,
      active: true,
      radius: BALL_RADIUS
    };

    let paddle = {
      x: LOGIC_SIZE / 2,
      y: PADDLE_Y,
      width: PADDLE_WIDTH,
      height: PADDLE_HEIGHT,
      targetX: LOGIC_SIZE / 2
    };

    let inputActive = false;
    let inputX = LOGIC_SIZE / 2;

    targetSpan.textContent = targetScore;

    function getBallSpeedForScore() {
      let bonus = 0;
      if (score >= 0) {
        const tiers0_19 = Math.min(score, 19);
        bonus += Math.floor(tiers0_19 / 5) * 0.1;
      }
      if (score >= 20) {
        const scoreIn20_49 = Math.min(score, 49) - 20;
        bonus += Math.floor(scoreIn20_49 / 2) * 0.1;
      }
      if (score >= 50) {
        const scoreIn50_99 = Math.min(score, 99) - 50;
        bonus += scoreIn50_99 * 0.1;
      }
      if (score >= 100) {
        const scoreIn100plus = score - 100;
        bonus += scoreIn100plus * 0.2;
      }
      return BASE_BALL_SPEED + bonus;
    }

    function updateSpeedDisplay() {
      speedSpan.textContent = ball.speed.toFixed(1);
    }

    function updateScoreDisplay() {
      scoreSpan.textContent = score;
    }

    function updateTargetDisplay() {
      targetSpan.textContent = targetScore;
      if (targetScore > 0 && score >= targetScore) {
        targetBoard.classList.add('highlight');
      } else {
        targetBoard.classList.remove('highlight');
      }
    }

    function updateHighScore() {
      if (score > highScore) {
        highScore = score;
      }
      const urlTarget = getTargetFromURL();
      targetScore = Math.max(highScore, urlTarget);
      updateTargetDisplay();
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      setTimeout(() => {
        toastEl.classList.remove('show');
      }, 2000);
    }

    function resetBall(keepScore = true) {
      if (!keepScore) {
        score = 0;
        updateScoreDisplay();
      }
      ball.x = LOGIC_SIZE / 2;
      ball.y = LOGIC_SIZE / 2;
      ball.vx = 0;
      ball.vy = 0;
      ball.active = false;
      ball.speed = getBallSpeedForScore();
      updateSpeedDisplay();
      gameOver = false;
      paddle.x = LOGIC_SIZE / 2;
      paddle.targetX = LOGIC_SIZE / 2;
      copyBtn.classList.remove('show');
      updateHighScore();
    }

    function resetGame() {
      resetBall(false);
    }

    function launchBall() {
      if (ball.active) return;
      if (gameOver) return;

      ball.speed = getBallSpeedForScore();
      updateSpeedDisplay();

      const angle = (Math.random() * 0.7 - 0.35) + (-Math.PI / 2);
      const vx = Math.cos(angle) * ball.speed;
      const vy = Math.sin(angle) * ball.speed;
      ball.vx = vx;
      ball.vy = vy;
      ball.active = true;
    }

    function checkGameOver() {
      if (ball.y - ball.radius > LOGIC_SIZE + 30) {
        gameOver = true;
        ball.active = false;
        if (score > highScore) {
          highScore = score;
        }
        const urlTarget = getTargetFromURL();
        targetScore = Math.max(highScore, urlTarget);
        updateTargetDisplay();
        copyBtn.classList.add('show');
      }
    }

    function copyScoreToClipboard() {
      const baseUrl = window.location.href.split('?')[0];
      const newUrl = `${baseUrl}?target=${targetScore}`;
      const message = `我在「像素弹球·节奏方块」中获得了 ${score} 分！最高目标 ${targetScore} 分，来挑战我吧 → ${newUrl}`;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(message).then(() => {
          showToast('战绩已复制！快去分享吧');
        }).catch(() => {
          fallbackCopy(message);
        });
      } else {
        fallbackCopy(message);
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      textarea.style.top = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      try {
        const success = document.execCommand('copy');
        if (success) {
          showToast('战绩已复制！快去分享吧');
        } else {
          showToast('复制失败，请手动截图分享');
        }
      } catch (err) {
        showToast('复制失败，请手动截图分享');
      }
      document.body.removeChild(textarea);
    }

    copyBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      copyScoreToClipboard();
    });

    function updatePhysics() {
      if (!ball.active || gameOver) return;

      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.x - ball.radius < 0) {
        ball.x = ball.radius;
        ball.vx = -ball.vx;
      } else if (ball.x + ball.radius > LOGIC_SIZE) {
        ball.x = LOGIC_SIZE - ball.radius;
        ball.vx = -ball.vx;
      }

      if (ball.y - ball.radius < 0) {
        ball.y = ball.radius;
        ball.vy = -ball.vy;
      }

      if (ball.vy > 0) {
        const paddleLeft = paddle.x - paddle.width / 2;
        const paddleRight = paddle.x + paddle.width / 2;
        const paddleTop = paddle.y - paddle.height / 2;
        const paddleBottom = paddle.y + paddle.height / 2;

        const closestX = Math.max(paddleLeft, Math.min(ball.x, paddleRight));
        const closestY = Math.max(paddleTop, Math.min(ball.y, paddleBottom));
        const dx = ball.x - closestX;
        const dy = ball.y - closestY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < ball.radius) {
          let nx = dx;
          let ny = dy;
          const len = Math.sqrt(nx * nx + ny * ny);
          if (len > 0.0001) {
            nx /= len;
            ny /= len;
          } else {
            nx = 0;
            ny = -1;
          }

          const overlap = ball.radius - dist;
          ball.x += nx * overlap;
          ball.y += ny * overlap;

          const hitFactor = (ball.x - paddle.x) / (paddle.width / 2);
          const clampedFactor = Math.max(-1, Math.min(1, hitFactor));

          ball.speed = getBallSpeedForScore();

          const newVx = clampedFactor * ball.speed * 1.3;
          const newVy = -Math.abs(ball.speed);

          const mag = Math.sqrt(newVx * newVx + newVy * newVy);
          if (mag > 0) {
            ball.vx = (newVx / mag) * ball.speed;
            ball.vy = (newVy / mag) * ball.speed;
          } else {
            ball.vx = 0;
            ball.vy = -ball.speed;
          }

          ball.vx += (Math.random() - 0.5) * 0.6;
          ball.vy -= Math.random() * 0.3;
          const finalMag = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
          if (finalMag > 0.1) {
            ball.vx = (ball.vx / finalMag) * ball.speed;
            ball.vy = (ball.vy / finalMag) * ball.speed;
          }

          score += 1;
          updateScoreDisplay();
          ball.speed = getBallSpeedForScore();
          updateSpeedDisplay();
          updateTargetDisplay();
          if (score > highScore) {
            highScore = score;
            const urlTarget = getTargetFromURL();
            targetScore = Math.max(highScore, urlTarget);
            updateTargetDisplay();
          }
        }
      }

      checkGameOver();
    }

    function updatePaddle() {
      if (gameOver) return;

      if (inputActive) {
        paddle.targetX = inputX;
      }

      const smoothness = 0.35;
      paddle.x += (paddle.targetX - paddle.x) * smoothness;

      const halfWidth = paddle.width / 2;
      if (paddle.x - halfWidth < 0) paddle.x = halfWidth;
      if (paddle.x + halfWidth > LOGIC_SIZE) paddle.x = LOGIC_SIZE - halfWidth;

      paddle.targetX = Math.max(halfWidth, Math.min(LOGIC_SIZE - halfWidth, paddle.targetX));
    }

    function draw() {
      ctx.clearRect(0, 0, LOGIC_SIZE, LOGIC_SIZE);

      ctx.fillStyle = '#191b2e';
      ctx.fillRect(0, 0, LOGIC_SIZE, LOGIC_SIZE);

      ctx.strokeStyle = '#2a2d4a';
      ctx.lineWidth = 1;
      const gridSize = 60;
      for (let i = 0; i <= LOGIC_SIZE; i += gridSize) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, LOGIC_SIZE);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(LOGIC_SIZE, i);
        ctx.stroke();
      }

      ctx.fillStyle = '#4f528b';
      ctx.beginPath();
      ctx.arc(80, 120, 3, 0, 2*Math.PI);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(520, 80, 4, 0, 2*Math.PI);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(400, 500, 5, 0, 2*Math.PI);
      ctx.fillStyle = '#3d406b';
      ctx.fill();

      const paddleLeft = paddle.x - paddle.width / 2;
      const paddleTop = paddle.y - paddle.height / 2;

      const gradient = ctx.createLinearGradient(paddleLeft, paddleTop, paddleLeft + paddle.width, paddleTop + paddle.height);
      gradient.addColorStop(0, '#5f7dff');
      gradient.addColorStop(0.5, '#b18aff');
      gradient.addColorStop(1, '#5f7dff');
      ctx.shadowColor = '#6d8cff';
      ctx.shadowBlur = 18;
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.roundRect(paddleLeft, paddleTop, paddle.width, paddle.height, 10);
      ctx.fill();

      ctx.shadowBlur = 8;
      ctx.fillStyle = '#eaeaff';
      ctx.beginPath();
      ctx.roundRect(paddleLeft + 4, paddleTop + 2, paddle.width - 8, 4, 4);
      ctx.fill();

      ctx.shadowBlur = 0;

      if (ball.active || !gameOver) {
        const ballGrad = ctx.createRadialGradient(
          ball.x - 5, ball.y - 5, 2,
          ball.x, ball.y, ball.radius * 1.8
        );
        ballGrad.addColorStop(0, '#fff9b0');
        ballGrad.addColorStop(0.5, '#ffb86b');
        ballGrad.addColorStop(1, '#f05e5e');
        ctx.shadowColor = '#ffaa55';
        ctx.shadowBlur = 24;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, 2 * Math.PI);
        ctx.fillStyle = ballGrad;
        ctx.fill();

        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(ball.x - 3, ball.y - 4, ball.radius * 0.3, 0, 2 * Math.PI);
        ctx.fillStyle = '#ffffffcc';
        ctx.fill();
      }

      if (!ball.active && !gameOver) {
        ctx.shadowBlur = 0;
        ctx.font = 'bold 32px system-ui, "Segoe UI", Roboto, sans-serif';
        ctx.fillStyle = '#e8eaff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = '#00000080';
        ctx.shadowBlur = 15;
        ctx.fillText('点击发射', LOGIC_SIZE / 2, LOGIC_SIZE / 2 + 70);
        const time = Date.now() / 200;
        const alpha = 0.5 + 0.5 * Math.sin(time);
        ctx.globalAlpha = alpha;
        ctx.font = '48px system-ui';
        ctx.fillStyle = '#ffe484';
        ctx.fillText('⚡', LOGIC_SIZE / 2, LOGIC_SIZE / 2 + 130);
        ctx.globalAlpha = 1.0;
      }

      if (gameOver) {
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(10, 10, 20, 0.75)';
        ctx.fillRect(0, 0, LOGIC_SIZE, LOGIC_SIZE);

        ctx.font = 'bold 52px system-ui, "Segoe UI", Roboto, sans-serif';
        ctx.fillStyle = '#ffb3b3';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = '#ff000080';
        ctx.shadowBlur = 20;
        ctx.fillText('游戏结束', LOGIC_SIZE / 2, LOGIC_SIZE / 2 - 50);

        ctx.font = 'bold 36px system-ui, sans-serif';
        ctx.fillStyle = '#f0e68c';
        ctx.shadowColor = '#ffaa00';
        ctx.fillText(`得分: ${score}`, LOGIC_SIZE / 2, LOGIC_SIZE / 2 + 30);

        if (targetScore > 0) {
          ctx.font = '24px system-ui, sans-serif';
          ctx.fillStyle = '#ffb86b';
          ctx.shadowColor = '#ff9f6b';
          ctx.fillText(`目标最高分: ${targetScore}`, LOGIC_SIZE / 2, LOGIC_SIZE / 2 + 85);
        }

        ctx.font = '28px system-ui, sans-serif';
        ctx.fillStyle = '#bbccff';
        ctx.shadowBlur = 12;
        ctx.fillText('点击屏幕重新开始', LOGIC_SIZE / 2, LOGIC_SIZE / 2 + 140);

        ctx.shadowBlur = 0;
      }

      ctx.shadowBlur = 0;
      ctx.shadowColor = 'transparent';
    }

    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      this.moveTo(x + r, y);
      this.lineTo(x + w - r, y);
      this.quadraticCurveTo(x + w, y, x + w, y + r);
      this.lineTo(x + w, y + h - r);
      this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      this.lineTo(x + r, y + h);
      this.quadraticCurveTo(x, y + h, x, y + h - r);
      this.lineTo(x, y + r);
      this.quadraticCurveTo(x, y, x + r, y);
      this.closePath();
      return this;
    };

    function updateInputFromClient(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const canvasRelativeX = clientX - rect.left;
      const logicX = (canvasRelativeX / rect.width) * LOGIC_SIZE;
      inputX = Math.max(0, Math.min(LOGIC_SIZE, logicX));
      inputActive = true;
    }

    function handlePointerDown(e) {
      e.preventDefault();
      if (e.touches) {
        if (e.touches.length > 0) {
          updateInputFromClient(e.touches[0].clientX, e.touches[0].clientY);
        }
      } else {
        updateInputFromClient(e.clientX, e.clientY);
      }

      if (gameOver) {
        resetGame();
        return;
      }

      if (!ball.active) {
        if (inputActive) {
          paddle.targetX = inputX;
        }
        launchBall();
      }
    }

    function handlePointerMove(e) {
      e.preventDefault();
      if (e.touches) {
        if (e.touches.length > 0) {
          updateInputFromClient(e.touches[0].clientX, e.touches[0].clientY);
        }
      } else {
        updateInputFromClient(e.clientX, e.clientY);
      }
    }

    function handlePointerUp(e) {
      e.preventDefault();
      inputActive = false;
    }

    function handlePointerLeave(e) {
      inputActive = false;
    }

    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    canvas.addEventListener('pointerdown', handlePointerDown);
    canvas.addEventListener('pointermove', handlePointerMove);
    canvas.addEventListener('pointerup', handlePointerUp);
    canvas.addEventListener('pointerleave', handlePointerLeave);
    canvas.addEventListener('pointercancel', handlePointerUp);

    canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
    canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    canvas.addEventListener('touchend', (e) => e.preventDefault(), { passive: false });

    function initCanvasSize() {
      canvas.width = LOGIC_SIZE;
      canvas.height = LOGIC_SIZE;
    }

    function gameLoop() {
      updatePaddle();
      updatePhysics();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function initGame() {
      initCanvasSize();
      score = 0;
      updateScoreDisplay();
      resetBall(false);
      updateTargetDisplay();
      gameLoop();
    }

    window.addEventListener('load', () => {
      initGame();
    });

  })();
</script>
</body>
</html>
